# 发布构建 / Release Build
# 功能：push tag 时现场构建 Admin 前端 → embed → 交叉编译静态二进制 → 附校验和发 Release
# 作者：仗键天涯(daxing) ｜ 邮箱：3442535897@qq.com ｜ 时间：2026-08-06 17:47:44
#
# 与 ci.yml 的关键差异：ci.yml 的 frontend 与 build-test 是两个互不依赖的 job，
# Go 构建 embed 的是仓库里已提交的 web/admin/dist。发布**绝不能**沿用该模式——
# 否则发出去的二进制可能带着陈旧前端。故此处严格串行：npm build → 校验 dist → go build。
name: Release

on:
  push:
    tags:
      - "v*"          # 只在 push tag 时触发，不在 push/PR 上跑

permissions:
  contents: write     # 建 Release 与上传 asset 所需

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "24"

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 现场构建 Admin 前端（不信任仓库内已提交的 dist）
        working-directory: web/admin/ui
        run: |
          npm ci
          npm run build

      - name: 确认 dist 产物就位（缺失即失败，绝不 embed 空壳）
        run: |
          test -f web/admin/dist/index.html || { echo "::error::web/admin/dist/index.html 缺失，前端未构建成功"; exit 1; }
          ls -l web/admin/dist/assets

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: 交叉编译静态二进制（现场 dist 已就位，embed 的即为本次构建产物）
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          # 平台矩阵：linux/amd64 为北极星必需；其余为顺带产出，不为它们增加复杂度。
          build() {
            local goos="$1" goarch="$2" ext="${3:-}"
            local out="dist/kartwo-${goos}-${goarch}${ext}"
            echo "==> ${out}"
            GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags "-s -w -X main.Version=${VERSION}" \
              -o "${out}" ./cmd/kartwo
          }
          build linux  amd64
          build linux  arm64
          build darwin arm64
          build windows amd64 .exe

      - name: 自检版本注入（linux/amd64 产物必须报出与 tag 一致的版本）
        run: |
          set -euo pipefail
          GOT="$(./dist/kartwo-linux-amd64 version)"
          echo "version 输出：${GOT}"
          test "${GOT}" = "${GITHUB_REF_NAME}" || {
            echo "::error::版本注入不符：期望 ${GITHUB_REF_NAME}，得 ${GOT}"; exit 1; }

      - name: 生成 SHA256 校验和
        working-directory: dist
        run: sha256sum kartwo-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 发布 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/kartwo-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          # 预发布 tag（含 -rc/-beta/-alpha）自动标记为 prerelease，不与正式版混淆。
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 逐平台标注验证状态：编译通过 ≠ 开过机。开源项目发一个没人开过机的产物，
          # 收到的 issue 比省下的时间贵。跑过冒烟的平台才改「已验证」。
          body: |
            ## 下载哪个？

            | 平台 | 文件 | 验证状态 |
            |---|---|---|
            | Linux x86_64（绝大多数 VPS） | `kartwo-linux-amd64` | ✅ **已验证**（干净 Ubuntu 24.04 实跑：启动→迁移→后台→店面） |
            | Linux ARM64 | `kartwo-linux-arm64` | ⚠️ **未验证**（仅编译通过，未开机冒烟） |
            | macOS Apple Silicon | `kartwo-darwin-arm64` | ⚠️ **未验证**（仅编译通过，未开机冒烟） |
            | Windows x86_64 | `kartwo-windows-amd64.exe` | ⚠️ **未验证**（仅编译通过，未开机冒烟） |

            > **「未验证」= 编译产出正常，但尚未有人在该平台上真正启动过。**
            > 遇到问题请提 issue，我们会据实修正标注。
            > 桌面系统（macOS/Windows）仅供本地评估试用，**生产卖货请用 Linux 服务器**。

            ## 运行环境要求

            - Linux 产物依赖 **glibc**（Ubuntu/Debian/CentOS 等主流发行版自带）。
              **musl 系（Alpine）暂不支持**。
            - 最低配置 1C1G；需在云厂商安全组放行 80 / 443 入站。

            ## 校验下载完整性

            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            ## 确认版本

            ```bash
            ./kartwo-linux-amd64 version
            ```
