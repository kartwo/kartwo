# golangci-lint 配置 / Lint Configuration
# 功能：统一静态检查规则（含安全相关 gosec），纳入 CI 门禁
# 作者：仗键天涯(daxing) ｜ 邮箱：3442535897@qq.com ｜ 时间：2026-06-17 17:05:46
version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec       # 安全相关静态检查
    - bodyclose
    - sqlclosecheck
  exclusions:
    rules:
      # 生成代码不纳入 lint。
      - path: internal/store/sqlcgen/
        linters:
          - errcheck
          - gosec
          - staticcheck
          - unused
      # 测试中读取临时目录路径属可控输入。
      - path: _test\.go
        linters:
          - gosec
      # 收款设置项「键名」常量含 Secret 字样触发 G101 误报（实为键名、非凭证本身）。
      - path: internal/payment/provider\.go
        text: "G101"
        linters:
          - gosec
      # G120 未识别紧邻 ParseMultipartForm 之前的 MaxBytesReader；四处已有请求体硬上限。
      - path: internal/admin/(blog|imports|media|shop)\.go
        source: 'if err := r\.ParseMultipartForm\((4|5) << 20\);'
        text: "G120:"
        linters:
          - gosec
      # Secure 由 secureFor 校验 TLS/可信代理；CSRF Cookie 须供 SPA 读取，session 仍 HttpOnly。
      # 既有 Cookie TLS/明文回归测试覆盖此部署兼容策略，仅豁免这些具体 SetCookie 调用。
      - path: internal/(admin/http|storefront/cart_http|storefront/checkout_http)\.go
        source: 'http\.SetCookie\(w, &http\.Cookie'
        text: "G124:"
        linters:
          - gosec
      # 路径先加根斜杠再 Clean，消除 .. 后 Join 到媒体根；Stat 仅拒绝目录，文件由 http.Dir 托管。
      - path: internal/server/server\.go
        source: 'os\.Stat\(filepath\.Join\(root, filepath\.Clean\("/"\+r\.URL\.Path\)\)\)'
        text: "G703:"
        linters:
          - gosec
      # 跳转地址来自服务端支付提供者的 HTTPS API 响应，非顾客提交的 return URL。
      - path: internal/storefront/checkout_http\.go
        source: 'http\.Redirect\(w, r, url, http\.StatusSeeOther\)'
        text: "G710:"
        linters:
          - gosec
      # 固定 /order/ 前缀与数据库订单 UUID 拼接，始终为站内路径。
      - path: internal/storefront/checkout_http\.go
        source: 'http\.Redirect\(w, r, "/order/"\+(publicID|orderRef)'
        text: "G710:"
        linters:
          - gosec
      # HTTPS 跳转仅在请求 Host 匹配配置域名时发生，目标域名来自服务配置。
      - path: internal/server/tls\.go
        source: 'http\.Redirect\(w, r, "https://"\+domain\+r\.URL\.RequestURI\(\)'
        text: "G710:"
        linters:
          - gosec
      # Shopify 旧链接仅跳固定 /p/ 前缀与数据库商品 slug，查询串附加在路径之后。
      - path: internal/storefront/http\.go
        source: 'http\.Redirect\(w, r, target, http\.StatusMovedPermanently\)'
        text: "G710:"
        linters:
          - gosec
      # robots.txt 显式 text/plain；统一中间件设置 nosniff，不作为 HTML 执行。
      - path: internal/storefront/http\.go
        source: 'fmt\.Fprintf\(w, "User-agent:'
        text: "G705:"
        linters:
          - gosec
